<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダチョウ診断</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4ece1; color: #333; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 600px; background: #fff; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #8b5a2b; font-size: 28px; }
        .question { text-align: left; background: #faf7f2; padding: 15px 20px; margin-bottom: 15px; border-left: 5px solid #d2b48c; border-radius: 4px; }
        .options label { display: block; margin: 8px 0; cursor: pointer; }
        button { background-color: #e67e22; color: white; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 25px; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 0 #d35400; transition: 0.1s; }
        button:active { transform: translateY(4px); box-shadow: none; }
        
        /* ワクワク演出用のローディング画面 */
        #loading { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(139, 90, 43, 0.95); color: white; z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        .ostrich-run { font-size: 50px; animation: run 0.6s infinite alternate; }
        @keyframes run { 0% { transform: translateY(0); } 100% { transform: translateY(-20px); } }
        .loading-text { font-size: 20px; font-weight: bold; margin-top: 20px; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="container">
    <h1>𓅦 ダチョウ診断 𓅦</h1>
    <p>あなたの行動から、どれくらいダチョウに近いかを計測します。</p>

    <form id="quizForm">
        <div class="question">
            <p>1. ピンチに陥ったとき、あなたならどうする？</p>
            <div class="options">
                <label><input type="radio" name="q1" value="3" required> 現実逃避して、見なかったことにする</label>
                <label><input type="radio" name="q1" value="1"> 必死に話し合って解決する</label>
                <label><input type="radio" name="q1" value="2"> とりあえずその場から全力で走って逃げる</label>
            </div>
        </div>

        <div class="question">
            <p>2. あなたの記憶力についての自信は？</p>
            <div class="options">
                <label><input type="radio" name="q2" value="3" required> 3歩歩いたら大体のことを忘れる</label>
                <label><input type="radio" name="q2" value="2"> 締め切りや約束をたまに忘れる</label>
                <label><input type="radio" name="q2" value="1"> 昔の細かい出来事までよく覚えている</label>
            </div>
        </div>

        <div class="question">
            <p>3. 周りの人からよく言われるあなたの特徴は？</p>
            <div class="options">
                <label><input type="radio" name="q3" value="1" required> 視野が広くてよく気が利く</label>
                <label><input type="radio" name="q3" value="3"> 体は大きいけれど、どこか抜けている</label>
                <label><input type="radio" name="q3" value="2"> フットワークが軽くて行動が早い</label>
            </div>
        </div>

        <button type="button" onclick="startDiagnosis()">運命の結果を見る！</button>
    </form>
</div>

<!-- ローディング画面演出 -->
<div id="loading">
    <div class="ostrich-run">𓅦💨</div>
    <div class="loading-text">ダチョウが脳内を爆走中...<br>診断結果を計算しています</div>
</div>

<script>
function startDiagnosis() {
    const form = document.getElementById('quizForm');
    if (!form.checkValidity()) {
        alert('すべての質問に答えてください！');
        return;
    }

    // スコア計算
    const score = parseInt(form.elements['q1'].value) + 
                  parseInt(form.elements['q2'].value) + 
                  parseInt(form.elements['q3'].value);

    // ローディング画面を表示
    document.getElementById('loading').style.display = 'flex';

    // 3秒後に結果ページ（result.html）へ点数を引き継いでジャンプ
    setTimeout(() => {
        window.location.href = `result.html?score=${score}`;
    }, 3000);
}
</script>
</body>
</html>
